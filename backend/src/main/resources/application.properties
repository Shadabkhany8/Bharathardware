# Bharat Sponge Application Configuration
spring.application.name=bharat-sponge-backend

server.port=8080
server.servlet.context-path=

# Database Configuration:
# Defaults to embedded H2 (PostgreSQL compatibility mode) with file persistence for zero-setup execution.
# To connect to external PostgreSQL, set DB_URL (e.g., export DB_URL=jdbc:postgresql://localhost:5432/bharat_sponge)
# or pass -Dspring-boot.run.profiles=postgres
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bharatsponge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security Configuration
bharatsponge.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
bharatsponge.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
bharatsponge.cors.allowed-origins=*

# Logging
logging.level.com.bharatsponge=INFO
logging.level.org.springframework.web=INFO
